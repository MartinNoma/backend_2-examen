spring.application.name=productos-service
server.port=${PORT:8081}

# Base de datos: por defecto H2 en memoria (local). En AWS se pasan DB_URL, DB_USER y DB_PASSWORD
# apuntando a RDS MySQL, por ejemplo:
#   DB_URL=jdbc:mysql://<endpoint-rds>:3306/nastyshoes_productos?createDatabaseIfNotExist=true
spring.datasource.url=${DB_URL:jdbc:h2:mem:productos;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Orígenes permitidos para CORS (separados por coma). Ej: http://mi-bucket.s3-website-us-east-1.amazonaws.com
app.cors.allowed-origins=${CORS_ORIGINS:*}

management.endpoints.web.exposure.include=health
